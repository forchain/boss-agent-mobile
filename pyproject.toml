[project]
name = "boss-agent-mobile"
version = "0.1.0"
description = "Android mobile automation framework and intelligent job application agent for Boss 直聘"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Appium-Python-Client>=4.0.0",
    "selenium>=4.20.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/droid_agent_core", "src/boss_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "live: marks tests requiring live Android device or emulator",
]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

