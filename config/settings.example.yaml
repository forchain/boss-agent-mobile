# ==============================================================================
# Boss Agent Mobile - Consolidated System & LLM Configuration Template
# ==============================================================================
# Copy this file to `config/settings.local.yaml` (which is git-ignored) to store
# your local device, PocketBase, LLM API keys, and automation preferences.
#
# Specifying CLI arguments or environment variables will override these settings.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Mobile Virtual Device & Appium Server
# ------------------------------------------------------------------------------
device: "emulator-5554"
avd_name: "boss_avd_arm64"          # Dedicated Android Virtual Device name (env: ANDROID_AVD)
server_url: "http://127.0.0.1:4723"  # Appium Server URL (env: APPIUM_SERVER_URL, APPIUM_URL)

# ------------------------------------------------------------------------------
# 2. PocketBase State Stream Broker
# ------------------------------------------------------------------------------
pocketbase_url: "http://127.0.0.1:8090" # PocketBase URL (env: POCKETBASE_URL, cli: --pb-url)

# ------------------------------------------------------------------------------
# 3. LLM Reasoning Provider
# ------------------------------------------------------------------------------
# Provider type (default: "openai" for all OpenAI-compatible REST endpoints)
provider: "openai"

# OpenAI-compatible API base URL (e.g. MiniMax, DeepSeek, OpenAI)
base_url: "https://api.minimaxi.com/v1"

# API Key (replace with your real secret key in config/settings.local.yaml)
api_key: "your-api-key-here"

# Model name (e.g. MiniMax-M3, deepseek-chat, gpt-4o-mini)
model: "MiniMax-M3"

# Sampling temperature (0.0 to 1.0, lower means more deterministic, default: 0.2)
temperature: 0.2

# Request timeout in seconds (default: 120.0)
timeout_sec: 120.0

# Max completion tokens in response (default: 262144)
max_tokens: 262144

# ------------------------------------------------------------------------------
# 4. LangSmith Observability & Tracing
# ------------------------------------------------------------------------------
langsmith_tracing: false
langsmith_api_key: "your-langsmith-api-key-here"
langsmith_project: "boss-agent-mobile"

# ------------------------------------------------------------------------------
# 5. Automation & Safety Rules
# ------------------------------------------------------------------------------
# System safety threshold restricting outbound mobile greeting volume per calendar day
daily_greeting_limit: 20

# Duration (seconds) to pause and preview greeting message in chat box before navigating back
preview_timeout_sec: 3.0

# 复投冷却时效（天）：已沟通岗位/直招企业避嫌在超过该天数后自动放宽，允许重新评估与投递。
# 0 表示永久避嫌，直到在 Web 界面手动解除。
communication_cooldown_days: 30

# Set to false to disable LLM match scoring and greeting drafting
enable_greeting: true

# ------------------------------------------------------------------------------
# 6. Preliminary Job Screening Policy & Blacklist/Whitelist Rules
# ------------------------------------------------------------------------------
# Master switch for deterministic rule-based preliminary screening (zero token cost)
enable_screening: true

# 招聘渠道 App-Enforced Filter（Boss 平台无原生渠道筛选，由本应用判定）：
#   "all"            直招与猎头岗位均接受（默认）
#   "direct_only"    仅直招岗位，猎头岗位被拦截（可被白名单放宽豁免）
#   "headhunter_only" 仅猎头岗位（可被白名单放宽豁免）
channel_preference: "all"

# 兴趣/专长放宽令牌（非准入闸门）：白名单绝不淘汰岗位；仅当岗位触发
# App-Enforced Filter 违例时，若卡片要素（标题/标签/公司/摘要）命中任一
# 白名单关键词，则视为候选人核心兴趣或深耕领域，予以豁免放宽继续评估。
title_whitelist: []

# 职位标题黑名单（一票否决，命中即淘汰，绝不进入详情页）
title_blacklist: ["销售", "电话销售", "电销", "管培生", "实习", "助理", "讲师", "课程顾问", "客服"]

# 公司黑名单（一票否决，受直招保护守卫约束，禁止将猎头渠道与保密企业加入）
company_blacklist: []

# 岗位卡片摘要黑名单（一票否决，仅匹配卡片摘要或标签，避免误伤整个 JD 详情）
jd_blacklist: ["驻场", "外包", "电销", "无底薪", "纯提成"]

# ------------------------------------------------------------------------------
# 7. 「仅沟通」列表 · 拒信清扫与公司拉黑（Rejection Triage & Company Blacklisting）
# ------------------------------------------------------------------------------
chat:
  # 识别到招聘者明确拒信后发送的礼貌收尾文案（env: CHAT_REJECTION_REPLY_TEXT）
  rejection_reply_text: "收到 谢谢"

  # 单次 CHECK_CHAT 任务最多交给大模型判定的消息条数，防止在消息堆积时无限扫描。
  # 带「送达/已读」状态标签的出站等待消息不消耗该额度（env: CHAT_MAX_SCAN_DEPTH）
  max_scan_depth: 30

  # 演练模式：只识别拒信并记录拟拉黑的企业，不改写筛选配置、不发送任何消息
  # （env: CHAT_DRY_RUN）
  dry_run: false

