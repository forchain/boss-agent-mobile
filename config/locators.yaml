# Boss Agent Mobile - Versioned Default UI Locators Configuration
# Local overrides can be placed in config/locators.local.yaml (higher priority, git-ignored)

startup:
  agree_btn:
    - "//*[@text='同意' or @text='同意并继续' or @text='好的']"
    - "//*[@text='同意协议']"

login:
  login_indicators:
    - "//*[@text='手机号登录' or @text='验证码登录' or @text='密码登录']"
    - "//*[@text='微信登录' or @text='其他登录方式']"
  captcha_indicator:
    - "//*[@text='拖动滑块完成拼图' or @text='安全验证' or @text='向右滑动']"

navigation:
  back_btn:
    - "//*[@content-desc='返回']"
    - "//*[contains(@resource-id, 'iv_back')]"
    - "//*[contains(@resource-id, 'btn_back')]"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/iv_back_ai']"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/iv_back']"

job_list:
  job_tab:
    - "com.hpbr.bosszhipin:id/tv_tab_1"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/tv_tab_1']"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/cl_tab_1']"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/main_tab_layout_view']//*[@text='职位']"
    - "//*[contains(@resource-id, 'main_tab_layout')]//*[@text='职位']"
    - "//*[@text='职位']"
  # Verified single-anchor XPath. Deliberately NOT a fallback list: every extra
  # candidate XPath costs a full accessibility-tree scan (~1s) on each miss,
  # which is what made home/search detection take tens of seconds.
  # The home screen search entry is also the home-page state anchor for
  # JobListPage.is_on_home_page().
  search_icon:
    - '//android.widget.LinearLayout[@resource-id="com.hpbr.bosszhipin:id/ly_menu"]/android.widget.RelativeLayout[2]/android.widget.ImageView[@resource-id="com.hpbr.bosszhipin:id/img_icon"]'
  job_card:
    - "com.hpbr.bosszhipin:id/view_job_card"
    - "//*[contains(@resource-id, 'view_job_card') or contains(@resource-id, 'cl_card_container') or contains(@resource-id, 'cl_position')]"
    - "//*[contains(@resource-id, 'job_name') or contains(@resource-id, 'tv_position_name')]"
    - "//*[contains(@resource-id, 'item_job') or contains(@resource-id, 'job_item') or contains(@resource-id, 'card_view') or contains(@resource-id, 'layout_job')]"
    - "//androidx.recyclerview.widget.RecyclerView/*[.//android.widget.TextView[contains(@text, '元') or contains(@text, '薪') or contains(@text, 'K') or contains(@text, 'k')]]"
  card_title:
    - "com.hpbr.bosszhipin:id/tv_position_name"
    - "//*[contains(@resource-id, 'tv_position_name') or contains(@resource-id, 'job_name')]"
  card_salary:
    - "com.hpbr.bosszhipin:id/tv_salary_statue"
    - "//*[contains(@resource-id, 'tv_salary_statue') or contains(@resource-id, 'salary')]"
  card_company:
    - "com.hpbr.bosszhipin:id/tv_company_name"
    - "//*[contains(@resource-id, 'tv_company_name') or contains(@resource-id, 'company_name')]"
  card_recruiter:
    - "com.hpbr.bosszhipin:id/tv_employer"
    - "//*[contains(@resource-id, 'tv_employer') or contains(@resource-id, 'employer')]"
  card_location:
    - "com.hpbr.bosszhipin:id/tv_distance"
    - "//*[contains(@resource-id, 'tv_distance') or contains(@resource-id, 'area')]"
  card_scale:
    - "com.hpbr.bosszhipin:id/tv_scale"
    - "//*[contains(@resource-id, 'tv_scale') or contains(@resource-id, 'scale')]"
  card_industry:
    - "com.hpbr.bosszhipin:id/tvIndustryName"
    - "//*[contains(@resource-id, 'tvIndustryName') or contains(@resource-id, 'industry')]"
  card_snippet:
    - "com.hpbr.bosszhipin:id/tv_digest"
    - "//*[contains(@resource-id, 'tv_digest') or contains(@resource-id, 'digest')]"
  card_tags_container:
    - "com.hpbr.bosszhipin:id/fl_require_info"
    - "//*[contains(@resource-id, 'fl_require_info')]"
  bottom_tips:
    - "com.hpbr.bosszhipin:id/tv_tips"
    - "//*[contains(@resource-id, 'tv_tips')]"
    - "//*[contains(@resource-id, 'recommend_tips')]"
    - "//*[contains(@text, '为你推荐')]"
    - "//*[contains(@text, '暂无其他符合职位')]"
    - "//*[contains(@text, '暂无符合职位')]"
    - "//*[contains(@text, '没有更多')]"

search:
  # Verified single anchor (measured on device: match in ~0.09s on the search
  # page, clean miss off it). Like job_list.search_icon this is deliberately NOT
  # a fallback list: four candidates made every "am I on the search page?" miss
  # walk the accessibility tree four times (~5.2s per miss).
  search_input:
    - "com.hpbr.bosszhipin:id/et_search"
  search_btn:
    - "com.hpbr.bosszhipin:id/tv_search"
    - "//*[@text='搜索']"
  clear_btn:
    - "com.hpbr.bosszhipin:id/iv_clear"
  back_btn:
    - "com.hpbr.bosszhipin:id/iv_back_ai"
    - "com.hpbr.bosszhipin:id/iv_back"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/iv_back']"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/iv_back_ai']"
    - "//*[@content-desc='返回']"

filter:
  filter_entry:
    - "//*[@resource-id='com.hpbr.bosszhipin:id/tv_tab_label' and (starts-with(@text, '筛选') or contains(@text, '筛选'))]"
    - "//*[starts-with(@text, '筛选') or contains(@text, '筛选')]"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/tv_title' and (starts-with(@text, '筛选') or contains(@text, '筛选'))]"
  confirm_btn:

    - "com.hpbr.bosszhipin:id/btn_confirm"
    - "//*[@text='确定']"
  reset_btn:
    - "com.hpbr.bosszhipin:id/btn_reset"
    - "//*[@text='清除']"
  close_btn:
    - "com.hpbr.bosszhipin:id/iv_back"
    - "com.hpbr.bosszhipin:id/iv_close"
    - "//*[@content-desc='关闭']"
    - "//*[@content-desc='返回']"
  option_item:
    - "//*[@resource-id='com.hpbr.bosszhipin:id/keywords_view_text' and (@text='{text}' or contains(@text, '{text}'))]"
    - "//*[@text='{text}']"

industry:
  filter_entry:
    - "//*[@resource-id='com.hpbr.bosszhipin:id/tv_tab_label' and (starts-with(@text, '行业') or contains(@text, '行业'))]"
    - "//*[starts-with(@text, '行业') or contains(@text, '行业')]"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/tv_title' and (starts-with(@text, '行业') or contains(@text, '行业'))]"
  confirm_btn:
    - "com.hpbr.bosszhipin:id/btn_confirm"
    - "//*[@text='确定']"
  cancel_btn:
    - "com.hpbr.bosszhipin:id/btn_cancel"
    - "//*[@text='取消']"
  option_item:
    - "//*[@resource-id='com.hpbr.bosszhipin:id/keywords_view_text' and (@text='{text}' or contains(@text, '{text}'))]"
    - "//*[@text='{text}']"
    - "//*[contains(@resource-id, 'text') and @text='{text}']"

job_detail:
  title:
    - "//*[contains(@resource-id, 'tv_job_name') or contains(@resource-id, 'job_title')]"
  company:
    - "//*[contains(@resource-id, 'tv_company_name') or contains(@resource-id, 'company_name') or contains(@resource-id, 'tv_brand_name') or contains(@resource-id, 'tv_com_name') or contains(@resource-id, 'tv_company')]"
  salary:
    - "//*[contains(@resource-id, 'tv_job_salary') or contains(@resource-id, 'salary')]"
  desc:
    - "com.hpbr.bosszhipin:id/tv_description"
    - "//*[contains(@resource-id, 'tv_description') or contains(@resource-id, 'tv_job_desc') or contains(@resource-id, 'job_description')]"
  expand_btn:
    - "//*[@text='查看全部' or @text='展开全文']"
  chat_btn:
    - "com.hpbr.bosszhipin:id/btn_chat"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/btn_chat']"
    - "//*[@text='立即沟通' or @text='继续沟通' or @text='聊一聊' or @text='去沟通' or @text='发消息' or @text='停止招聘' or @text='职位已关闭' or @text='已下线']"
  back_btn:
    - "//*[@content-desc='返回' or contains(@resource-id, 'iv_back')]"

system_dialog:
  permission_buttons:
    - "com.android.permissioncontroller:id/permission_allow_button"
    - "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
    - "//*[@text='允许' or @text='同意' or @text='确定' or @text='好的']"
    - "//*[@text='SKIP' or @text='Skip' or @text='跳过' or @text='CANCEL' or @text='Cancel' or @text='取消' or @text='稍后']"

chat:
  chat_entry_btn:
    - "//*[@text='立即沟通' or @text='继续沟通' or @text='聊一聊' or @text='发消息']"
    - "//*[contains(@resource-id, 'btn_chat') or contains(@resource-id, 'btn_communicate') or contains(@resource-id, 'tv_chat')]"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/btn_chat']"
  message_input:
    - "//*[@resource-id='com.hpbr.bosszhipin:id/editText_with_scrollbar']"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/chat_editor']"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/et_sendmessage']"
    - "//*[@resource-id='com.hpbr.bosszhipin:id/et_message']"
    - "//android.widget.EditText[@hint='介绍自己回复率更高哦~']"
    - "//android.widget.EditText[contains(@resource-id, 'scrollbar') or contains(@resource-id, 'chat') or contains(@resource-id, 'send') or contains(@resource-id, 'msg') or contains(@resource-id, 'editor')]"
  send_btn:
    - "//*[@resource-id='com.hpbr.bosszhipin:id/btn_send']"
    - "//*[@text='发送']"
  back_btn:
    - "//*[@resource-id='com.hpbr.bosszhipin:id/iv_back']"
    - "//*[@content-desc='返回' or contains(@resource-id, 'iv_back') or contains(@resource-id, 'btn_back')]"


